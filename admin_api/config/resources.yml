# Server-side mirror of wrapped-and-more-admin/src/resources/*.ts's ResourceConfig — the
# allow-list every generic /resources/{table}/... request is validated against (see
# admin_api/services/resource_registry.py's module docstring). Default-deny: a table absent here
# is unreachable through the API.
#
# `offer_products` and `offer_categories` (composite primary keys) are deliberately NOT declared
# here — they're reachable only through admin_api/handlers/offers_handler.py's bespoke
# scope/attach and scope/detach endpoints.
#
# Column `type:` drives the SQL cast a filter/range value is bound with (db/query_types.py) —
# get it right for every column that appears in `filterable` or `sortable` below; it matters far
# less for a column that's only ever read/written by primary key.
#
# `*_groups` mirror wrapped-and-more-admin's STAFF_ROLES ([super_admin, admin, ops, sales]) and
# OWNER_ROLES ([super_admin, admin]) from src/lib/enums.ts. An empty list is an unconditional deny
# (see services/auth_service.py's require_group) — how "no one may write this through the API" is
# expressed for audit_logs, offer_redemptions' update/delete, and the two read-only
# system/ML-pipeline-owned tables (recommendation_logs, product_embeddings).

staff: &staff [super_admin, admin, ops, sales]
owner: &owner [super_admin, admin]
none: &none []

resources:
  # --- Catalog ---------------------------------------------------------------

  products:
    table: products
    columns:
      - {name: id, type: integer}
      - {name: category_id, type: integer, writable: true}
      - {name: name, type: text, writable: true, required: true}
      - {name: description, type: text, writable: true}
      - {name: brand, type: text, writable: true}
      - {name: base_price, type: numeric, writable: true}
      - {name: min_order_quantity, type: integer, writable: true}
      - {name: is_customizable, type: boolean, writable: true}
      - {name: status, type: text, writable: true, required: true}
      - {name: created_at, type: timestamp}
      - {name: updated_at, type: timestamp}
    relations:
      - {name: category, table: categories, local_key: category_id, columns: [id, name]}
    searchable: [name, brand, description]
    filterable: [status, category_id, is_customizable]
    sortable: [name, brand, base_price, min_order_quantity, status, created_at]
    default_sort: {column: created_at, ascending: false}
    read_groups: *staff
    create_groups: *staff
    update_groups: *staff
    delete_groups: *staff
    audited: true

