    default_sort: {column: name, ascending: true}
    read_groups: *staff
    create_groups: *owner
    update_groups: *owner
    delete_groups: *owner
    audited: true

  users:
    table: users
    primary_key: id
    columns:
      - {name: id, type: integer}
      - {name: organization_id, type: integer, writable: true}
      - {name: first_name, type: text, writable: true, required: true}
      - {name: last_name, type: text, writable: true}
      - {name: email, type: text, writable: true, required: true}
      - {name: phone, type: text, writable: true}
      # password_hash is intentionally never declared here — a column absent from this list
      # can never be read or written through the API at all (see audit_service.py's separate,
      # belt-and-suspenders redaction of the same column).
      - {name: cognito_sub, type: text}
      - {name: role, type: text, writable: true, required: true}
      - {name: is_active, type: boolean, writable: true}
