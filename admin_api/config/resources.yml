    filterable: [role, is_active, organization_id]
    sortable: [email, role, created_at]
    default_sort: {column: created_at, ascending: false}
    read_groups: *staff
    create_groups: *owner
    update_groups: *owner
    delete_groups: *owner
    audited: true

  # --- System ---------------------------------------------------------------

  audit_logs:
    table: audit_logs
    columns:
      - {name: id, type: integer}
      - {name: entity_type, type: text}
      - {name: entity_id, type: integer}
      - {name: action, type: text}
      - {name: old_value, type: jsonb}
      - {name: new_value, type: jsonb}
      - {name: performed_by, type: integer}
      - {name: created_at, type: timestamp}
    relations:
      - {name: actor, table: users, local_key: performed_by, columns: [id, first_name, last_name, email]}
    searchable: [entity_type, action]
    filterable: [entity_type, performed_by]
    sortable: [entity_type, entity_id, action, created_at]
    default_sort: {column: created_at, ascending: false}
    read_groups: *staff
    # Only admin_api/services/audit_service.py writes here (bypassing this generic path
    # entirely) — the API itself never lets a client write an audit row directly.
    create_groups: *none
    update_groups: *none
    delete_groups: *none
    audited: false

  conversation_sessions:
    table: conversation_sessions
    columns:
      - {name: id, type: integer}
      - {name: whatsapp_number, type: text, writable: true, required: true}
      - {name: session_state, type: jsonb, writable: true}
      - {name: created_at, type: timestamp}
      - {name: updated_at, type: timestamp}
    searchable: [whatsapp_number]
    filterable: []
    sortable: [whatsapp_number, created_at, updated_at]
    default_sort: {column: updated_at, ascending: false}
    read_groups: *staff
    create_groups: *staff
    update_groups: *staff
    delete_groups: *staff
    audited: true

  recommendation_logs:
    table: recommendation_logs
    columns:
      - {name: id, type: integer}
      - {name: session_id, type: integer}
      - {name: recommendation_json, type: jsonb}
      - {name: created_at, type: timestamp}
    relations:
      - {name: session, table: conversation_sessions, local_key: session_id, columns: [id, whatsapp_number]}
    searchable: []
    filterable: [session_id]
    sortable: [created_at]
    default_sort: {column: created_at, ascending: false}
    read_groups: *staff
    # Written only by the WhatsApp agent's own pipeline (GenAI/app), never by hand.
    create_groups: *none
    update_groups: *none
    delete_groups: *none
    audited: false

  product_embeddings:
    table: product_embeddings
    # No single-column id — keyed on product_id (mirrors the frontend's rowKey/noDetail on this
    # resource). Update/delete are denied outright, so this only ever needs primary_key for the
    # (unused) detail lookup path.
    primary_key: product_id
    columns:
      - {name: product_id, type: integer}
      - {name: embedding_id, type: text}
      - {name: created_at, type: timestamp}
    relations:
      - {name: product, table: products, local_key: product_id, columns: [id, name]}
    searchable: [embedding_id]
    filterable: [product_id]
    sortable: [embedding_id, created_at]
    default_sort: {column: created_at, ascending: false}
    read_groups: *staff
    # Written only by GenAI/app/jobs/embed_products.py, never by hand.
    create_groups: *none
    update_groups: *none
    delete_groups: *none
    audited: false
